name: Generate Daily Dev Meme

on:
  schedule:
    - cron: "0 0 * * *"  # runs daily at midnight UTC
  workflow_dispatch: # allow manual run

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch random meme
        id: meme
        run: |
          echo "Fetching random meme..."
          response=$(curl -s https://meme-api.com/gimme)
          image_url=$(echo $response | jq -r '.preview[2]')
          echo "Meme URL: $image_url"
          curl -L "$image_url" -o meme.png

      - name: Create output directory
        run: mkdir -p dist && mv meme.png dist/meme.png

      - name: Push meme.png to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
